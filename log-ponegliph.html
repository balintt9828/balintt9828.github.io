                title: "Tóth Ferenc Pincészet",
                answer: "luffy",
                next: "Farsang Pincészet (27-es pince)"
            },
            {
                title: "Farsang Pincészet",
                answer: "sanji",
                next: "Petrény Winery (47-es pince)"
            },
            {
                title: "Petrény Winery",
                answer: "franky",
                next: "Ostorosbor (33-as pince)"
            },
            {
                title: "Ostorosbor",
                answer: "brook",
                next: "Gratulálunk! Megtaláltátok a One Piece-t!"
            }
        ];

        // Betöltéskor visszaolvassuk az állapotot
        let current = parseInt(localStorage.getItem("currentStation")) || 0;

        updateHeader();

        function checkAnswer() {

            const input = normalize(document.getElementById("answer").value);

            if (input === normalize(stations[current].answer)) {

                document.getElementById("result").textContent = "✔ Helyes!";
                document.getElementById("location").innerHTML =
                    "Hajózz tovább: <br><b>" + stations[current].next + "</b>";

                current++;

                // Elmentjük a haladást
                localStorage.setItem("currentStation", current);

                updateHeader();

            } else {

                document.getElementById("result").textContent =
                    "✖ Ez nem a jelenlegi sziget megfejtése.";

            }

        }

        function updateHeader() {

            if (current >= stations.length) {

                document.getElementById("stage").innerHTML =
                    "🏴‍☠️ Küldetés teljesítve!";

            } else {

                document.getElementById("stage").innerHTML =
                    `${current + 1}. állomás – <b>${stations[current].title}</b>`;

            }

        }

        function normalize(text) {
            return text
                .toLowerCase()
                .trim()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }
    </script>
  </body>
</html>
